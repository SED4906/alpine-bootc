name: Build container image

on:
  schedule:
    - cron: '43 18 * * *'
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**/README.md'
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: alpine-bootc
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: edge


jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> ${GITHUB_ENV}

      - name: Prepare environment (amd64)
        if: matrix.os == 'ubuntu-26.04'
        run: |
          echo "IMAGE_PLATFORM=amd64" >> ${GITHUB_ENV}

      - name: Prepare environment (arm64)
        if: matrix.os == 'ubuntu-26.04-arm'
        run: |
          echo "IMAGE_PLATFORM=arm64" >> ${GITHUB_ENV}

      - name: Build Image
        id: build-image
        run: |
          podman build --pull=newer --tag "${IMAGE_NAME}:${DEFAULT_TAG}-${IMAGE_PLATFORM}" --file Containerfile .

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        run: |
          set -euox pipefail
          podman push --digestfile=/tmp/digestfile ${IMAGE_NAME}:${DEFAULT_TAG}-${IMAGE_PLATFORM} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}-${IMAGE_PLATFORM}

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT
  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> ${GITHUB_ENV}

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Manifest
        run: |
          podman manifest create ${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}-amd64 ${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}-arm64

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        run: |
          set -euox pipefail
          podman manifest push --digestfile=/tmp/digestfile ${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT
